# Распределение работы по участникам команды.
# Каждый загружает и анализирует свои группы, чтобы не дублировать
# скачивание и разделить объём данных. Скрипты загрузки
# принимают имя участника и берут только его группы.
team:
  vlad:
    futures: [indices, metals]
    stocks: [health_care, materials, blue_chips]
  enkira:
    futures: [currencies, agriculture]
    stocks: [information_technology, energy, real_estate]
  sasha:
    futures: [bonds, crypto]
    stocks: [communication_services, financials, utilities]
  iura:
    futures: [energy]
    stocks: [consumer_discretionary, consumer_staples, industrials]

