# Общий список инструментов проекта.
# Скрипты загрузки берут тикеры только отсюда.
#
# Правила отбора:
# - только основные контракты фьючерсов, без mini, micro и nano;
# - только инструменты с полной историей за период 15.11.2021 — 30.09.2026,
#   чтобы данные по всем инструментам были сопоставимы;
# - всё, что не прошло отбор, перечислено в excluded с причиной.
#
# Источники (проверено 31.10.2026):
# - фьючерсы: группы — списки команды в docs/reference/instruments/ (файлы 1–7);
#   коды, официальные названия и даты начала торгов — Massive
#   https://api.massive.com/futures/v1/products
#   roll_months — торгуемые месяцы: по ним строится цепочка контрактов
#   для склейки. Основа — циклы CME, проверено по объёмам Massive за 2023 год
#   (какой контракт был лидером по объёму в каждый день).
# - акции: состав секторов GICS — фонды State Street Select Sector SPDR,
#   повторяющие секторные индексы S&P 500 (XLK, XLC, XLY, XLP, XLF, XLV,
#   XLI, XLE, XLB, XLRE, XLU); вес в S&P 500 — фонд SPY. Данные на 29.10.2026:
#   https://www.ssga.com/us/en/intermediary/library-content/products/fund-data/etfs/us/holdings-daily-us-en-spy.xlsx
#   (для сектора — тот же адрес с кодом фонда вместо spy, например ...-en-xlk.xlsx);
#   названия, даты листинга и смены тикеров — Massive
#   https://api.massive.com/v3/reference/tickers

